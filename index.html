        .lang-btn:hover {
            color: var(--text-main);

        }

        }

        .boton-descarga:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--color-bronce) 100%);
        }

        .grid-caracteristicas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .tarjeta {
            background-color: var(--card-bg);
            border: 1px solid #242b35;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }

        .tarjeta h3 {
            color: var(--accent-gold);
            margin-top: 0.5rem;
        }

        .seccion-purista {
            background: radial-gradient(circle, #1a202c 0%, #0d0f12 100%);
            border: 2px solid var(--color-bronce);
            border-radius: 16px;
            padding: 2.5rem;
            margin-top: 2rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        }

        .contenedor-purista {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }

        @media (min-width: 768px) {
            .contenedor-purista {
                flex-direction: row;
                align-items: center;
            }
        }

        .bloque-texto-purista {
            flex: 1;
        }

            color: var(--accent-gold);
            font-size: 2rem;
            margin-top: 0;
            text-transform: uppercase;
            border-bottom: 1px solid var(--color-bronce);

            color: var(--text-main);
        }

            border-left: 4px solid var(--accent-gold);
            padding: 1.25rem;
            margin: 1.5rem 0;
            font-style: italic;
        }

        .bloque-interactivo-imagenes {
            flex: 1;
            position: relative;
            width: 100%;
            max-width: 360px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            aspect-ratio: 1 / 2.1;
        }

        .imagen-rack {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .capa-detalle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagen-detalle {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bloque-interactivo-imagenes:hover .capa-detalle-overlay {
            opacity: 1;
            pointer-events: auto;
        }

            reportLink.href = data.reportFile;

            document.getElementById("privacyLink").textContent = data.privacy;

            document.querySelectorAll(".lang-btn").forEach(function(btn) {
                btn.classList.remove("active");
            });

            const activeButton = document.getElementById("btn-" + lang);
            if (activeButton) activeButton.classList.add("active");
        }

        document.addEventListener("DOMContentLoaded", function() {
            setLang("en");
        });
    </script>

</body>
</html>
